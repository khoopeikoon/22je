<body>
  <div data-header></div>

  <main>
    <header class="page-head">
      <div class="wrap reveal">
        <span class="eyebrow">联系我们</span>
        <h1>与我们<em>联系</em>。</h1>
        <p class="lede">这里可以成为您探索新加坡与东南亚的起点。</p>
      </div>
    </header>

    <section class="section" style="padding-top:0">
      <div class="wrap contact-grid">
        <div class="contact-card reveal">
          <dl>
            <dt>物业经理</dt>
            <dd>Kevin</dd>
            <dt>电话与 WhatsApp</dt>
            <dd><a href="tel:+6580167691">+65 8016 7691</a></dd>
            <dt>电邮</dt>
            <dd><a href="mailto:info@22je.sg">info@22je.sg</a></dd>
            <dt>地址</dt>
            <dd>22 Jalan Elok<br>Singapore 229060</dd>
          </dl>
          <div class="btn-row">
            <a class="btn" data-wa="您好！我想咨询入住 22 Jalan Elok，请问空房情况和租金如何？" href="#">WhatsApp</a>
            <a class="btn btn--ghost" href="https://www.google.com/maps/dir//22+Jln+Elok,+Singapore+229060" target="_blank" rel="noopener">获取路线</a>
          </div>
        </div>

        <form class="form reveal" id="enquiry" novalidate>
          <span class="eyebrow">咨询</span>
          <h3>告诉我们您的入住需求</h3>
          <div class="form__row">
            <div class="field"><label for="f-name">姓名</label><input id="f-name" name="name" autocomplete="name" required></div>
            <div class="field"><label for="f-email">电邮</label><input id="f-email" name="email" type="email" autocomplete="email"></div>
          </div>
          <div class="form__row">
            <div class="field">
              <label for="f-room">房间</label>
              <select id="f-room" name="room">
                <option>任意房间</option>
                <option value="aurelia">Aurelia 金曦套房</option>
                <option value="elysia">Elysia 怡境套房（大床）</option>
                <option value="elysia-twin">Elysia 怡境套房（双床）</option>
                <option value="deluxe-queen">豪华大床房</option>
                <option value="deluxe-twin">豪华双床房</option>
              </select>
            </div>
            <div class="field"><label for="f-movein">入住日期</label><input id="f-movein" name="movein" type="date"></div>
          </div>
          <div class="form__row">
            <div class="field">
              <label for="f-length">租期</label>
              <select id="f-length" name="length">
                <option>3 个月</option>
                <option>4–6 个月</option>
                <option>7–12 个月</option>
                <option>12 个月以上</option>
              </select>
            </div>
            <div class="field">
              <label for="f-pass">居留身份 / 准证</label>
              <select id="f-pass" name="pass">
                <option>新加坡公民 / 永久居民</option>
                <option>就业准证（EP）</option>
                <option>S 准证</option>
                <option>工作准证</option>
                <option>其他 / 不确定</option>
              </select>
            </div>
          </div>
          <div class="field"><label for="f-msg">其他事项</label><textarea id="f-msg" name="message" placeholder="入住人数、问题、特别要求……"></textarea></div>
          <div class="btn-row">
            <button class="btn" type="submit">通过 WhatsApp 发送</button>
            <button class="btn btn--ghost" type="button" data-email>通过电邮发送</button>
          </div>
          <p class="form__note">将打开 WhatsApp 或您的电邮应用，并自动填入您的资料。本网站不会储存任何信息。</p>
        </form>
      </div>
    </section>

    <section aria-label="地图">
      <iframe class="map" title="22 Jalan Elok 地图" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
        src="https://www.google.com/maps?q=22+Jalan+Elok,+Singapore+229060&amp;z=16&amp;hl=zh-CN&amp;output=embed"></iframe>
    </section>
