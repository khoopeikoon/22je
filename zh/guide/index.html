<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="../../favicon.ico" sizes="48x48">
  <link rel="icon" href="../../assets/img/icon/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="../../apple-touch-icon.png">
  <title>住户指南 | 22 Jalan Elok</title>
  <meta name="description" content="在 22 Jalan Elok 生活：联系方式、公共空间、垃圾与回收，以及洗衣机和烘干机的使用方法。">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/style.css?v=2026102401">
</head>
<body>
  <div data-header></div>

  <main>
    <header class="page-head">
      <div class="wrap">
        <span class="eyebrow">住户专用</span>
        <h1>住户<em>指南</em>。</h1>
        <p class="lede">在 22 Jalan Elok 日常生活所需了解的一切。</p>
        <p class="guide-actions"><button type="button" class="btn btn--ghost" onclick="window.print()">打印或保存为 PDF</button></p>
      </div>
    </header>

    <section class="section" style="padding-top:0">
      <div class="wrap guide-layout">
        <nav class="guide-toc" aria-label="目录"><strong>目录</strong><ol id="guide-toc"></ol></nav>
        <article class="guide" id="guide"><p>正在加载指南……</p></article>
      </div>
    </section>
  </main>

  <div data-footer></div>
  <script src="../../assets/js/main.js?v=2026102401"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script>
    // The Chinese guide's text lives in guide.md (same folder): edit that file, not this one.
    (async () => {
      const el = document.getElementById("guide");
      try {
        const res = await fetch("guide.md", { cache: "no-cache" });
        if (!res.ok) throw new Error(res.status);
        el.innerHTML = marked.parse(await res.text());
      } catch (e) {
        el.innerHTML = "<p>抱歉，指南无法加载。请通过 WhatsApp 联系我们。</p>";
        return;
      }
      // Highlight unfinished bits
      el.innerHTML = el.innerHTML.replace(/\[to confirm(:[^\]]*)?\]/gi, m => `<mark class="tbc">${m.slice(1, -1)}</mark>`);
      // Wrap tables so they scroll on phones; give headings ids; build contents
      el.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "guide-table"; t.before(w); w.append(t); });
      const toc = document.getElementById("guide-toc");
      el.querySelectorAll("h2").forEach(h => {
        h.id = h.textContent.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "");
        const li = document.createElement("li");
        li.innerHTML = `<a href="#${h.id}">${h.textContent}</a>`;
        toc.append(li);
      });
      el.querySelectorAll("img").forEach(img => {
        const fig = document.createElement("figure"), cap = document.createElement("figcaption");
        cap.textContent = img.alt; img.loading = "lazy";
        img.closest("p").replaceWith(fig); fig.append(img, cap);
      });
      el.querySelectorAll('a[href^="http"]').forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
      if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
    })();
  </script>
</body>
</html>
