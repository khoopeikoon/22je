<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8F%A0</text></svg>">
  <title>Availability | 22 Jalan Elok</title>
  <meta name="description" content="Room availability at 22 Jalan Elok through December 2028.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div data-header></div>

  <main>
    <header class="page-head" style="padding-bottom:24px">
      <div class="wrap">
        <span class="eyebrow">Availability</span>
        <h1>Room <em>availability.</em></h1>
        <p class="lede">Choose a room, tap your check-in and check-out dates, then send them to us on WhatsApp. This calendar is indicative — always confirm exact dates with us before making plans.</p>
        <p id="calChecked" style="margin-top:14px;font-size:0.78rem;letter-spacing:0.08em;color:var(--muted)"></p>
      </div>
    </header>

    <div class="wrap">
      <div class="room-tabs" id="roomTabs" role="tablist" aria-label="Choose a room"></div>

      <div class="cal-legend">
        <span><i class="swatch avail"></i> Available — tap to select</span>
        <span><i class="swatch booked"></i> Booked</span>
        <span><i class="swatch selected"></i> Your dates</span>
        <span><i class="swatch today"></i> Today</span>
      </div>

      <h2 class="room-title" id="roomTitle"></h2>
      <p class="room-sub" id="roomSub"></p>

      <div id="calendarArea" style="padding-bottom:96px"></div>
    </div>
  </main>

  <div class="date-fab" id="dateFab" role="status">
    <div class="date-fab-text" id="dateFabText"></div>
    <button class="date-fab-clear" id="dateFabClear" title="Clear selection" aria-label="Clear selected dates">×</button>
    <a class="btn disabled" id="dateFabWhatsapp" href="#" target="_blank" rel="noopener">Send on WhatsApp</a>
  </div>

  <div data-footer></div>
  <script src="../assets/js/main.js"></script>
  <script>
/* ============================================================
   EDIT ME #1 — Rooms and bookings
   For each room, list the date ranges that are BOOKED using
   "YYYY-MM-DD". The end date is shown as booked too, e.g.
     bookings: [{ start: "2026-11-01", end: "2027-01-31" }]
   The id is the link anchor: calendar/#aurelia opens that room.
   Bump LAST_CHECKED on every edit, and whenever the calendar is
   confirmed still correct (aim for every week or two).
   ============================================================ */
const LAST_CHECKED = "2026-10-10";
const ROOMS = [
  { id: "elysia3", name: "Elysia Suite 3 (Twin)",  sub: "Suite",     bookings: [] },
  { id: "elysia",  name: "Elysia Suite 4 (Queen)", sub: "Suite",     bookings: [{ start: "2026-10-09", end: "2027-02-08" }] },
  { id: "aurelia", name: "Aurelia Suite",       sub: "Suite",        bookings: [] },
  { id: "dq1",     name: "Deluxe Queen Room 1", sub: "Deluxe Queen", bookings: [] },
  { id: "dq3",     name: "Deluxe Queen Room 3", sub: "Deluxe Queen", bookings: [] },
  { id: "dq4",     name: "Deluxe Queen Room 4", sub: "Deluxe Queen", bookings: [{ start: "2026-10-09", end: "2026-10-15" }] },
  { id: "dt1",     name: "Deluxe Twin Room 1",  sub: "Deluxe Twin",  bookings: [] },
  { id: "dt3",     name: "Deluxe Twin Room 3",  sub: "Deluxe Twin",  bookings: [] },
  { id: "dt4",     name: "Deluxe Twin Room 4",  sub: "Deluxe Twin",  bookings: [] },
];

/* ============================================================
   EDIT ME #2 — Calendar range
   Calendars run from the current month through this end point.
   (The WhatsApp number comes from SITE in assets/js/main.js.)
   ============================================================ */
const CAL_END_YEAR = 2028;
const CAL_END_MONTH = 11; // 0 = Jan ... 11 = Dec

document.getElementById("calChecked").textContent = "Availability last checked: " +
  new Date(LAST_CHECKED + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });

/* ------------------------------------------------------------
   No edits needed below this line.
   ------------------------------------------------------------ */
const tabsEl = document.getElementById("roomTabs");
const titleEl = document.getElementById("roomTitle");
const subEl = document.getElementById("roomSub");
const areaEl = document.getElementById("calendarArea");

const fmtDate = (y, m, d) =>
  `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
const isBooked = (dateStr, ranges) =>
  ranges.some((r) => dateStr >= r.start && dateStr <= r.end);

let currentRoom = null;
let selStart = null;
let selEnd = null;

function renderRoom(room) {
  currentRoom = room;
  selStart = null;
  selEnd = null;

  titleEl.textContent = room.name;
  subEl.textContent = `${room.sub} · availability through December ${CAL_END_YEAR}`;
  areaEl.innerHTML = "";

  const today = new Date();
  const todayStr = fmtDate(today.getFullYear(), today.getMonth(), today.getDate());
  const dows = ["S", "M", "T", "W", "T", "F", "S"];

  let y = today.getFullYear();
  let m = today.getMonth();
  let currentYear = null;
  let grid = null;

  while (y < CAL_END_YEAR || (y === CAL_END_YEAR && m <= CAL_END_MONTH)) {
    if (y !== currentYear) {
      currentYear = y;
      const label = document.createElement("div");
      label.className = "year-label";
      label.textContent = y;
      areaEl.appendChild(label);
      grid = document.createElement("div");
      grid.className = "cal-months";
      areaEl.appendChild(grid);
    }

    const monthEl = document.createElement("div");
    monthEl.className = "cal-month";
    const title = document.createElement("h4");
    title.textContent = new Date(y, m, 1).toLocaleDateString("en-SG", { month: "long", year: "numeric" });
    monthEl.appendChild(title);

    const g = document.createElement("div");
    g.className = "cal-grid";
    dows.forEach((l) => {
      const el = document.createElement("div");
      el.className = "cal-dow";
      el.textContent = l;
      g.appendChild(el);
    });
    const firstDow = new Date(y, m, 1).getDay();
    for (let b = 0; b < firstDow; b++) {
      const el = document.createElement("div");
      el.className = "cal-day blank";
      g.appendChild(el);
    }
    const totalDays = new Date(y, m + 1, 0).getDate();
    for (let day = 1; day <= totalDays; day++) {
      const dateStr = fmtDate(y, m, day);
      const el = document.createElement("div");
      el.className = "cal-day";
      el.dataset.date = dateStr;
      const booked = isBooked(dateStr, room.bookings);
      const isPast = dateStr < todayStr;
      if (booked) el.classList.add("booked");
      if (isPast) el.classList.add("past");
      if (dateStr === todayStr) el.classList.add("today");
      if (!booked && !isPast) {
        el.classList.add("selectable");
        el.addEventListener("click", () => handleDayClick(dateStr));
      }
      el.textContent = day;
      g.appendChild(el);
    }
    monthEl.appendChild(g);
    grid.appendChild(monthEl);

    m++;
    if (m > 11) { m = 0; y++; }
  }

  applySelectionClasses();
  updateFab();
}

/* Date-range selection + WhatsApp handoff */
const fmtNice = (dateStr) =>
  new Date(dateStr + "T00:00:00").toLocaleDateString("en-SG", { day: "numeric", month: "short", year: "numeric" });
const nightsBetween = (a, b) =>
  Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);

function rangeHasBooked(start, end, ranges) {
  const d = new Date(start + "T00:00:00");
  const endD = new Date(end + "T00:00:00");
  while (d <= endD) {
    if (isBooked(fmtDate(d.getFullYear(), d.getMonth(), d.getDate()), ranges)) return true;
    d.setDate(d.getDate() + 1);
  }
  return false;
}

function handleDayClick(dateStr) {
  if (!selStart || selEnd) {
    selStart = dateStr; selEnd = null;
  } else if (dateStr === selStart) {
    selStart = null; selEnd = null;
  } else if (dateStr < selStart || rangeHasBooked(selStart, dateStr, currentRoom.bookings)) {
    selStart = dateStr; selEnd = null;
  } else {
    selEnd = dateStr;
  }
  applySelectionClasses();
  updateFab();
}

function applySelectionClasses() {
  document.querySelectorAll(".cal-day[data-date]").forEach((el) => {
    el.classList.remove("in-range", "range-start", "range-end");
    const ds = el.dataset.date;
    if (!selStart) return;
    if (ds === selStart) el.classList.add("range-start");
    else if (selEnd && ds === selEnd) el.classList.add("range-end");
    else if (selEnd && ds > selStart && ds < selEnd) el.classList.add("in-range");
  });
}

function updateFab() {
  const fab = document.getElementById("dateFab");
  const textEl = document.getElementById("dateFabText");
  const waBtn = document.getElementById("dateFabWhatsapp");

  if (!selStart) {
    fab.classList.remove("visible");
    return;
  }
  fab.classList.add("visible");

  if (!selEnd) {
    textEl.innerHTML = `${fmtNice(selStart)}<small>Now tap a check-out date</small>`;
    waBtn.classList.add("disabled");
    waBtn.href = "#";
  } else {
    const nights = nightsBetween(selStart, selEnd);
    textEl.innerHTML = `${fmtNice(selStart)} – ${fmtNice(selEnd)}<small>${nights} night${nights === 1 ? "" : "s"}</small>`;
    waBtn.classList.remove("disabled");
    waBtn.href = waLink(`Good day! I'd like to check availability for the ${currentRoom.name} from ${selStart} to ${selEnd}.`);
  }
}

document.getElementById("dateFabClear").addEventListener("click", () => {
  selStart = null; selEnd = null;
  applySelectionClasses();
  updateFab();
});

const tabButtons = [];

function activateRoom(room, updateHash) {
  tabButtons.forEach((b) => {
    const on = b.dataset.roomId === room.id;
    b.classList.toggle("active", on);
    b.setAttribute("aria-selected", on);
  });
  renderRoom(room);
  if (updateHash) history.replaceState(null, "", "#" + room.id);
}

ROOMS.forEach((room) => {
  const btn = document.createElement("button");
  btn.className = "room-tab";
  btn.textContent = room.name;
  btn.dataset.roomId = room.id;
  btn.setAttribute("role", "tab");
  btn.addEventListener("click", () => {
    activateRoom(room, true);
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  tabsEl.appendChild(btn);
  tabButtons.push(btn);
});

/* Deep links — calendar/#aurelia opens straight to that room. */
const roomFromHash = () => ROOMS.find((r) => r.id === location.hash.slice(1));
activateRoom(roomFromHash() || ROOMS[0], false);
window.addEventListener("hashchange", () => {
  const match = roomFromHash();
  if (match) activateRoom(match, false);
});
  </script>
</body>
</html>
