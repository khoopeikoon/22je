<body>
  <div data-header></div>

  <main>
    <header class="page-head" style="padding-bottom:24px">
      <div class="wrap">
        <span class="eyebrow">空室状況</span>
        <h1>空室<em>カレンダー</em>。</h1>
        <p class="lede">お部屋を選び、チェックイン日とチェックアウト日をタップして、WhatsApp でお送りください。このカレンダーは目安です。ご予定を立てる前に、必ず日程を当方にご確認ください。</p>
        <p id="calChecked" style="margin-top:14px;font-size:0.78rem;letter-spacing:0.08em;color:var(--muted)"></p>
      </div>
    </header>

    <div class="wrap">
      <div class="room-tabs" id="roomTabs" role="tablist" aria-label="お部屋を選ぶ"></div>

      <div class="cal-legend">
        <span><i class="swatch avail"></i> 空室：タップして選択</span>
        <span><i class="swatch booked"></i> 予約済み</span>
        <span><i class="swatch selected"></i> ご希望の日程</span>
        <span><i class="swatch today"></i> 今日</span>
      </div>

      <h2 class="room-title" id="roomTitle"></h2>
      <p class="room-sub" id="roomSub"></p>

      <div id="calendarArea" style="padding-bottom:96px"></div>
    </div>
  </main>

  <div class="date-fab" id="dateFab" role="status">
    <div class="date-fab-text" id="dateFabText"></div>
    <button class="date-fab-clear" id="dateFabClear" title="選択を解除" aria-label="選択した日程を解除">×</button>
    <a class="btn disabled" id="dateFabWhatsapp" href="#" target="_blank" rel="noopener">WhatsApp で送信</a>
  </div>

  <div data-footer></div>
