</head>
<body>
  <div data-header></div>

  <main>
    <header class="page-head">
      <div class="wrap reveal">
        <span class="eyebrow">お問い合わせ</span>
        <h1>お気軽に<em>ご連絡</em>ください。</h1>
        <p class="lede">ここが、シンガポールと東南アジアへのあなたの拠点になるかもしれません。</p>
      </div>
    </header>

    <section class="section" style="padding-top:0">
      <div class="wrap contact-grid">
        <div class="contact-card reveal">
          <dl>
            <dt>物件マネージャー</dt>
            <dd>Kevin</dd>
            <dt>電話・WhatsApp・Telegram</dt>
            <dd><a href="tel:+6580167691">+65 8016 7691</a></dd>
            <dt>Telegram</dt>
            <dd><a href="https://t.me/twentytwoje" target="_blank" rel="noopener">@twentytwoje</a></dd>
            <dt>メール</dt>
            <dd><a href="mailto:info@22je.sg">info@22je.sg</a></dd>
            <dt>住所</dt>
            <dd>22 Jalan Elok<br>Singapore 229060</dd>
          </dl>
          <div class="btn-row">
            <a class="btn" data-wa="こんにちは。22 Jalan Elok への滞在について問い合わせたいです。空室状況と料金を教えていただけますか？&#10;Hello! I'd like to enquire about a stay at 22 Jalan Elok. Could you please share availability and rates?" href="#">WhatsApp</a>
            <a class="btn btn--ghost" href="https://t.me/twentytwoje" target="_blank" rel="noopener">Telegram</a>
            <a class="btn btn--ghost" href="https://www.google.com/maps/dir//22+Jln+Elok,+Singapore+229060" target="_blank" rel="noopener">道順を見る</a>
          </div>
        </div>

        <form class="form reveal" id="enquiry" novalidate>
          <span class="eyebrow">お問い合わせフォーム</span>
          <h2 style="font-size:clamp(1.5rem, 2.4vw, 2rem)">ご滞在についてお聞かせください</h2>
          <div class="form__row">
            <div class="field"><label for="f-name">お名前</label><input id="f-name" name="name" autocomplete="name" required></div>
            <div class="field"><label for="f-email">メール</label><input id="f-email" name="email" type="email" autocomplete="email"></div>
          </div>
          <!-- data-en puts the English name beside the Japanese one in the message, for the manager. -->
          <div class="form__row">
            <div class="field">
              <label for="f-room">お部屋</label>
              <select id="f-room" name="room">
                <option data-en="Any room">どのお部屋でも</option>
                <option value="aurelia" data-en="Aurelia Suite">Aurelia スイート</option>
                <option value="elysia" data-en="Elysia Suite (queen)">Elysia スイート（クイーン）</option>
                <option value="elysia-twin" data-en="Elysia Suite (twin)">Elysia スイート（ツイン）</option>
                <option value="deluxe-queen" data-en="Deluxe Queen Room">デラックスクイーンルーム</option>
                <option value="deluxe-twin" data-en="Deluxe Twin Room">デラックスツインルーム</option>
              </select>
            </div>
            <div class="field"><label for="f-movein">入居希望日</label><input id="f-movein" name="movein" type="date"></div>
          </div>
          <div class="form__row">
            <div class="field">
              <label for="f-length">滞在期間</label>
              <select id="f-length" name="length">
                <option data-en="3 months">3か月</option>
                <option data-en="4–6 months">4〜6か月</option>
                <option data-en="7–12 months">7〜12か月</option>
                <option data-en="More than 12 months">12か月以上</option>
              </select>
            </div>
            <div class="field">
              <label for="f-pass">在留資格 / パス</label>
              <select id="f-pass" name="pass">
                <option data-en="Singapore citizen / PR">シンガポール国民 / 永住者</option>
                <option data-en="Employment Pass">Employment Pass（就労ビザ）</option>
                <option data-en="S Pass">S Pass</option>
                <option data-en="Work Permit">Work Permit</option>
                <option data-en="Student's Pass">Student's Pass（学生ビザ）</option>
                <option data-en="Other / not sure">その他 / わからない</option>
              </select>
            </div>
          </div>
          <div class="field"><label for="f-msg">その他</label><textarea id="f-msg" name="message" placeholder="人数、ご質問、ご要望など…"></textarea></div>
          <div class="btn-row">
            <button class="btn" type="submit">WhatsApp で送信</button>
            <button class="btn btn--ghost" type="button" data-email>メールで送信</button>
          </div>
          <p class="form__note">WhatsApp またはメールアプリが開き、入力内容が自動で入力されます。このサイトには何も保存されません。</p>
        </form>
      </div>
    </section>

    <section aria-label="地図">
      <iframe class="map" title="22 Jalan Elok の地図" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
        src="https://www.google.com/maps?q=22+Jalan+Elok,+Singapore+229060&amp;z=16&amp;hl=ja&amp;output=embed"></iframe>
    </section>
  </main>

  <div data-footer></div>
  <script src="../assets/js/main.js?v=2026102101"></script>
