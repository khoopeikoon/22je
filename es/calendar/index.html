  <link rel="stylesheet" href="../../assets/css/style.css?v=2026102902">
</head>
<body>
  <div data-header></div>

  <main>
    <header class="page-head" style="padding-bottom:24px">
      <div class="wrap">
        <span class="eyebrow">Disponibilidad</span>
        <h1>Disponibilidad de <em>habitaciones.</em></h1>
        <p class="lede">Elija una habitación y sus fechas, y envíenoslas por WhatsApp con un solo toque. Le responderemos para confirmarlas.</p>
        <p id="calChecked" style="margin-top:14px;font-size:0.78rem;letter-spacing:0.08em;color:var(--muted)"></p>
      </div>
    </header>

    <div class="wrap">
      <div class="room-tabs" id="roomTabs" role="tablist" aria-label="Elija una habitación"></div>

      <div class="cal-legend">
        <span><i class="swatch avail"></i> Disponible: toque para elegir</span>
        <span><i class="swatch booked"></i> Reservado</span>
        <span><i class="swatch selected"></i> Sus fechas</span>
        <span><i class="swatch today"></i> Hoy</span>
      </div>

      <h2 class="room-title" id="roomTitle"></h2>
      <p class="room-sub" id="roomSub"></p>

      <div id="calendarArea" style="padding-bottom:96px"></div>
    </div>
  </main>

  <div class="date-fab" id="dateFab" role="status">
    <div class="date-fab-text" id="dateFabText"></div>
    <button type="button" class="date-fab-clear" id="dateFabClear" title="Borrar selección" aria-label="Borrar las fechas elegidas">×</button>
    <a class="btn disabled" id="dateFabWhatsapp" href="#" target="_blank" rel="noopener">Enviar por WhatsApp</a>
  </div>

  <div data-footer></div>
  <script src="../../assets/js/main.js?v=2026102902"></script>
  <script src="../../assets/js/calendar.js?v=2026102902"></script>
</body>
